services:
  postgres:
    image: postgres:16-alpine
    container_name: blog-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: blog-pgvector
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgvector-data:/var/lib/postgresql/data

  seaweed:
    image: chrislusf/seaweedfs:latest
    container_name: blog-seaweed
    restart: unless-stopped
    ports:
      - '9333:9333'
      - '8080:8080'
      - '8333:8333'
    command: >
      server -dir=/data -master.port=9333 -volume.port=8080 -s3 -s3.port=8333 -s3.allowEmptyFolder=true
    volumes:
      - seaweed-data:/data

volumes:
  postgres-data:
  pgvector-data:
  seaweed-data:
